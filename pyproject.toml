[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS: an enterprise agentic AI platform built on LangGraph."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint>=2.0",
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-redis>=0.1",
    "langchain-neo4j>=0.2",
    "langchain-mcp-adapters>=0.1",
    "qdrant-client>=1.11",
    "elasticsearch[async]>=8.15",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "docker>=7.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pandas>=2.2",
    "pytesseract>=0.3",
    "Pillow>=10.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "sentence-transformers>=3.1",
    "llmlingua>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
