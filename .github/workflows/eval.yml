name: Retrieval Eval

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      elasticsearch:
        image: elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports: ["9200:9200"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run retrieval eval against baseline
        run: python -m backend.app.evaluation.run_eval --report eval_report.json --baseline tests/eval/baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
